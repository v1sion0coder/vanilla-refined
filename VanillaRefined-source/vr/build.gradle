plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }
version = "${mod_version}+26.2"
group = 'dev.v1sion'
base { archivesName = 'VanillaRefined' }
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}
processResources {
    inputs.property 'version', version
    filesMatching('fabric.mod.json') { expand 'version': version }
}
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

loom {
    runs {
        client { programArgs "--quickPlaySingleplayer", "test", "--width", "1280", "--height", "720", "--username", "v1sion" }
    }
}
